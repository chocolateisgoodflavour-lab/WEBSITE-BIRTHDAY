<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Princess Playlist 💖</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #0a0a0a, #1a001a);
  color: white;
  text-align: center;
}

/* Opening screen */
#intro {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(135deg,#000,#2b0a2b);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

/* Headings */
h1, h2 {
  color: pink;
}

/* Playlist box */
.playlist {
  margin-top: 50px;
  padding: 20px;
}
</style>
</head>

<body>

<!-- 💖 OPENING SCREEN -->
<div id="intro">
  <h1>💖 Welcome Princess 💖</h1>
  <p>This playlist is made just for you</p>

  <button onclick="document.getElementById('intro').style.display='none'"
    style="
    padding:10px 20px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:pink;
    cursor:pointer;">
    Enter 💕
  </button>
</div>

<!-- 💌 TITLE -->
<h1>🎵 Princess Playlist 🎵</h1>

<!-- 🎵 APPLE MUSIC PLAYLIST -->
<div class="playlist">
  <iframe allow="autoplay *; encrypted-media *;"
    frameborder="0"
    height="450"
    style="width:90%;max-width:700px;"
    sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
    src="https://music.apple.com/in/playlist/princess-playlist/pl.u-9N9L2a4t1kEMkgX">
  </iframe>
</div>

<!-- 💖 FLOATING HEARTS -->
<script>
setInterval(() => {
  const heart = document.createElement("div");
  heart.innerHTML = "💖";
  heart.style.position = "fixed";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.top = "100vh";
  heart.style.fontSize = "20px";
  heart.style.animation = "floatUp 4s linear";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 4000);
}, 300);
</script>

<style>
@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-100vh); opacity: 0; }
}
</style>

</body>
</html>
