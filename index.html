<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 💖</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #0a0a0a, #1a001a);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* START SCREEN */
#intro {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(135deg,#000,#2b0a2b);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

/* BUTTON */
button {
  padding: 12px 20px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: pink;
  cursor: pointer;
}

/* HEADINGS */
h1, h2 {
  color: pink;
}

/* CONTENT */
.container {
  padding: 30px;
}

/* LINK BUTTON */
a {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 20px;
  background: hotpink;
  color: black;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<!-- 💖 START SCREEN -->
<div id="intro">
  <h1>💖 Welcome Princess 💖</h1>
  <p>A small gift made with love</p>

  <button onclick="document.getElementById('intro').style.display='none'">
    Enter 💕
  </button>
</div>

<!-- 🎵 BACKGROUND MUSIC (Ed Sheeran - Perfect) -->
<audio autoplay loop>
  <source src="https://dn720307.ca.archive.org/0/items/edsheeranperfect/Ed%20Sheeran%20-%20Perfect.mp3" type="audio/mpeg">
</audio>

<!-- 💌 MAIN CONTENT -->
<div class="container">

  <h1>💖 For You 💖</h1>

  <p>
    This is something small, but made with a lot of care.
  </p>

  <!-- 🎵 APPLE MUSIC LINK -->
  <h2>🎵 Her Playlist</h2>

  <p>Click below to open your playlist 💖</p>

  <a href="https://music.apple.com/in/playlist/princess-playlist/pl.u-9N9L2a4t1kEMkgX"
     target="_blank">
     Open on Apple Music 🎧
  </a>

</div>

<!-- 💖 FLOATING HEARTS -->
<script>
setInterval(() => {
  const heart = document.createElement("div");
  heart.innerHTML = "💖";
  heart.style.position = "fixed";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.top = "100vh";
  heart.style.fontSize = "20px";
  heart.style.animation = "floatUp 4s linear";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 4000);
}, 300);
</script>

<style>
@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-100vh); opacity: 0; }
}
</style>

</body>
</html>
